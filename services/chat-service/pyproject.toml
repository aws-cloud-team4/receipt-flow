[project]
name = "chat-service"
version = "0.1.0"
description = "Asks for purpose/department/project while extraction runs, streams replies over SSE (owner: ② AI·데이터)"
requires-python = ">=3.13,<3.14"
dependencies = ["receiptflow-common", "uvicorn[standard]>=0.37"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_service"]
