[project]
name = "receiptflow-common"
version = "0.1.0"
description = "Shared config, auth, storage and domain rules for Receipt Flow services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.120",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receiptflow_common"]
