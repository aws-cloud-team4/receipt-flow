[project]
name = "preprocess-service"
version = "0.1.0"
description = "Server-side receipt correction with OpenCV for low-end devices (owner: ② AI·데이터)"
requires-python = ">=3.13,<3.14"
dependencies = ["receiptflow-common", "uvicorn[standard]>=0.37", "opencv-python-headless>=4.11", "numpy>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocess_service"]
