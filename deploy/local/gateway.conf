# Plays the ALB ingress locally: the same path routing as deploy/k8s/ingress.yaml.
server {
  listen 8088;
  # Resolve service names per request (Docker DNS): containers get new IPs when recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api-service:8000;
  set $chat http://chat-service:8000;
  set $preprocess http://preprocess-service:8000;
  set $web http://web:8080;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;

  location /api/        { proxy_pass $api; }
  location /preprocess/ { proxy_pass $preprocess; }
  # Server-sent events: pass each chunk on at once (the ALB does not buffer either).
  location /chat/       { proxy_pass $chat; proxy_buffering off; }
  location /            { proxy_pass $web; }
}
