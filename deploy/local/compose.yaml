# Every container the cluster runs, on this PC, against the real AWS resources in services/.env.
#   bash deploy/local/run.sh            # build, start, open http://localhost:8088
#   docker compose -f deploy/local/compose.yaml down
# Same images and commands as deploy/k8s; AWS access comes from your CLI login (exported into
# deploy/local/.env.aws by run.sh) instead of Pod Identity. Only one ocr-worker should poll the
# shared queue: stop the local dev backend (scripts/dev.sh) first.
x-service: &service
  env_file: [.env.rf, .env.aws]
  restart: unless-stopped

services:
  api-service:
    <<: *service
    image: receipt-flow/api-service:local
    build: {context: ../../services, args: {SERVICE: api-service}}
    command: ["uvicorn", "api_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
  chat-service:
    <<: *service
    image: receipt-flow/chat-service:local
    build: {context: ../../services, args: {SERVICE: chat-service}}
    command: ["uvicorn", "chat_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
  preprocess-service:
    <<: *service
    image: receipt-flow/preprocess-service:local
    build: {context: ../../services, args: {SERVICE: preprocess-service}}
    command: ["uvicorn", "preprocess_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
  ocr-worker:
    <<: *service
    image: receipt-flow/ocr-worker:local
    build: {context: ../../services, args: {SERVICE: ocr-worker}}
    command: ["ocr-worker"]
  web:
    image: receipt-flow/web:local
    build:
      context: ../../web
      args: {VITE_AUTH_MODE: "${VITE_AUTH_MODE:-cognito}", VITE_COGNITO_CLIENT_ID: "${VITE_COGNITO_CLIENT_ID:-}"}
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8088:8088"]
    depends_on: [api-service, chat-service, preprocess-service, web]
