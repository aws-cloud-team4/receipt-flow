# 1 replica in the test deploy. In the final deploy (SCALING=1) KEDA scales it on the queue length:
# deploy/k8s-scaling/ocr-worker-keda.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocr-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  labels: {app: ocr-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ocr-worker}
  template:
    metadata:
      labels: {app: ocr-worker}
    spec:
      serviceAccountName: ocr-worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: ocr-worker
          command: ["ocr-worker"]
          envFrom: [{configMapRef: {name: rf-config}}]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 256Mi}
