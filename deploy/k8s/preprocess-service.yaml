apiVersion: v1
kind: ServiceAccount
metadata:
  name: preprocess-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocess-service
  labels: {app: preprocess-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: preprocess-service}
  template:
    metadata:
      labels: {app: preprocess-service}
    spec:
      serviceAccountName: preprocess-service
      containers:
        - name: app
          image: preprocess-service
          command: ["uvicorn", "preprocess_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: rf-config}}]
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: preprocess-service
spec:
  selector: {app: preprocess-service}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: preprocess-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: preprocess-service}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
